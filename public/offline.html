<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sin conexión · Andiamo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #F3ECD8;
      color: #1B1A17;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .logo {
      font-size: 2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #C44428;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.125rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.875rem;
      color: #6B6452;
      max-width: 20rem;
      line-height: 1.6;
    }
    button {
      margin-top: 2rem;
      background: #C44428;
      color: white;
      border: none;
      padding: 0.625rem 1.5rem;
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      border-radius: 2px;
      box-shadow: 3px 3px 0 #1B1A17;
    }
    button:active { transform: translate(3px,3px); box-shadow: none; }
  </style>
</head>
<body>
  <div class="logo">Andiamo ✈</div>
  <h1>Sin conexión</h1>
  <p>Necesitás internet para cargar esta página. Las que ya visitaste siguen disponibles.</p>
  <button onclick="location.reload()">Reintentar</button>
</body>
</html>
