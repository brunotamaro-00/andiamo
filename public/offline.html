<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sin conexión · Andiamo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #F3ECD8;
      color: #1B1A17;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .logo {
      font-size: 2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #C44428;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.125rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.875rem;
      color: #6B6452;
      max-width: 20rem;
      line-height: 1.6;
    }
    .actions {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }
    button, .link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      background: #C44428;
      color: #FFFFFF;
      border: none;
      padding: 0.625rem 1.5rem;
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      border-radius: 2px;
      box-shadow: 3px 3px 0 #1B1A17;
      text-decoration: none;
      font-family: inherit;
    }
    .link {
      background: transparent;
      color: #1B1A17;
      border: 2px solid #1B1A17;
      box-shadow: none;
    }
    button:active, .link:active { transform: translate(3px,3px); box-shadow: none; }
  </style>
</head>
<body>
  <div class="logo">Andiamo ✈</div>
  <h1>Sin conexión</h1>
  <p>Necesitás internet para cargar esta página. Las que ya visitaste siguen disponibles.</p>
  <!-- The itinerary is precached (SHELL_ROUTES + "Descargar viaje"), so offer it as
       a way out instead of leaving reload() as the only action on a dead end. -->
  <div class="actions">
    <button onclick="location.reload()">Reintentar</button>
    <a class="link" href="/stops">Ver itinerario guardado</a>
  </div>
</body>
</html>
