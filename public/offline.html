<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sin conexión · Andiamo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #F3ECD8;
      color: #1B1A17;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    /* La marca va como SVG inline: este archivo es standalone (lo sirve el SW
       sin red), así que no puede usar <Brand /> ni pedir /brand/*.png. Los
       paths son los de brand/logo-master.svg. */
    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .logo svg { width: 2rem; height: auto; fill: #C44428; }
    .logo span {
      font-size: 2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    h1 {
      font-size: 1.125rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.875rem;
      color: #6B6452;
      max-width: 20rem;
      line-height: 1.6;
    }
    .actions {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }
    button, .link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      background: #C44428;
      color: #FFFFFF;
      border: none;
      padding: 0.625rem 1.5rem;
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      border-radius: 2px;
      box-shadow: 3px 3px 0 #1B1A17;
      text-decoration: none;
      font-family: inherit;
    }
    .link {
      background: transparent;
      color: #1B1A17;
      border: 2px solid #1B1A17;
      box-shadow: none;
    }
    button:active, .link:active { transform: translate(3px,3px); box-shadow: none; }
  </style>
</head>
<body>
  <div class="logo">
    <svg viewBox="330 230 360 520" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(0,1024) scale(0.1,-0.1)" fill-rule="evenodd">
        <path d="M5415 7738 c-50 -58 -101 -153 -110 -208 -6 -34 -2 -41 67 -116 40 -44 134 -147 208 -229 74 -82 187 -206 250 -275 63 -70 211 -232 329 -361 l214 -235 213 -629 c118 -345 216 -631 219 -634 3 -2 4 263 3 590 l-3 594 -25 55 c-17 37 -74 111 -180 230 -85 96 -327 371 -539 610 -211 239 -428 486 -483 548 -55 61 -103 112 -108 112 -5 0 -29 -24 -55 -52z"/>
        <path d="M5236 7268 c-92 -136 -99 -305 -17 -466 16 -32 103 -173 192 -313 89 -140 188 -294 219 -344 31 -49 74 -117 95 -150 l39 -60 43 -380 c23 -209 42 -383 43 -387 0 -5 -182 -8 -405 -8 -223 0 -405 1 -405 3 0 3 74 434 129 752 92 537 91 564 -18 750 -27 46 -58 106 -68 135 -23 66 -76 119 -167 165 -94 48 -127 50 -138 10 -5 -16 -49 -187 -98 -380 -49 -192 -110 -424 -134 -515 l-45 -165 -148 -143 c-81 -78 -208 -200 -281 -270 -273 -260 -440 -515 -542 -827 -91 -282 -100 -382 -100 -1192 l0 -643 784 0 784 0 7 47 c10 67 48 165 89 226 68 102 25 68 1101 859 477 351 486 359 521 405 53 69 77 146 77 238 0 76 -7 98 -118 420 -64 187 -181 530 -260 762 -79 232 -149 432 -156 444 -6 12 -82 99 -168 193 -86 94 -293 321 -459 504 -167 182 -313 343 -324 357 -27 34 -30 33 -72 -27z"/>
      </g>
    </svg>
    <span>Andiamo</span>
  </div>
  <h1>Sin conexión</h1>
  <p>Necesitás internet para cargar esta página. Las que ya visitaste siguen disponibles.</p>
  <!-- The itinerary is precached (SHELL_ROUTES + "Descargar viaje"), so offer it as
       a way out instead of leaving reload() as the only action on a dead end. -->
  <div class="actions">
    <button onclick="location.reload()">Reintentar</button>
    <a class="link" href="/stops">Ver itinerario guardado</a>
  </div>
</body>
</html>
